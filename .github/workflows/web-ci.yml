name: web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # CI-only database and demo Firebase project — never real Neon/Supabase or
  # Firebase credentials. See docs/roadmap.md's standing constraint: this
  # workflow must never be given credentials for the existing Firebase
  # project or its data; auth tests run entirely against the local emulator.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/brandisby_ci?schema=public"
  FIREBASE_PROJECT_ID: "demo-brandisby"
  NEXT_PUBLIC_FIREBASE_API_KEY: "demo-api-key"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-brandisby.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-brandisby"
  NEXT_PUBLIC_FIREBASE_APP_ID: "demo-app-id"
  NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"

jobs:
  checks:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brandisby_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm run db:migrate:deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      - run: npm run build
