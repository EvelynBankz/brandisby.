name: web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Demo Firebase project — never real Firebase credentials or data. See
  # docs/roadmap.md's standing constraint: this workflow must never be given
  # credentials for the existing Firebase project; everything here runs
  # against the local Auth/Firestore emulators.
  FIREBASE_PROJECT_ID: "demo-brandisby"
  FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
  FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
  NEXT_PUBLIC_FIREBASE_API_KEY: "demo-api-key"
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "demo-brandisby.firebaseapp.com"
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: "demo-brandisby"
  NEXT_PUBLIC_FIREBASE_APP_ID: "demo-app-id"
  NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: "127.0.0.1:9099"
  NEXT_PUBLIC_FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"

jobs:
  checks:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # The Firestore emulator (used by `npm run test` and the build step
      # below) requires Java 21+; the runner's default JDK is older.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

      # The homepage statically generates at build time and reads Firestore
      # (for SEO/performance in production) — needs the emulator running.
      - run: npx firebase emulators:exec --only auth,firestore --project demo-brandisby "npm run build"
